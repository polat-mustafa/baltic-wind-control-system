version: 2
# Grouped weekly updates: one PR per ecosystem (+ separate majors) instead of one PR per package.
# Fewer PRs = fewer CI runs and less review noise.
updates:
  # Python (backend) — uv ecosystem keeps backend/uv.lock in sync
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "[DEPS]"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  # npm (frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: "[DEPS]"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "[CI]"
    groups:
      github-actions:
        patterns: ["*"]
