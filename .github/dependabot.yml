version: 2
# Grouped weekly updates: one PR per ecosystem (+ separate majors) instead of one PR per package.
# Fewer PRs = fewer CI runs and less review noise.
updates:
  # Python (backend) — uv ecosystem keeps backend/uv.lock in sync
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "[DEPS]"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  # npm (frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: "[DEPS]"
    groups:
      # vitest and its plugins must move in lockstep (mismatched majors break coverage)
      vitest:
        patterns: ["vitest", "@vitest/*"]
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 (native compiler) crashes the current tsc/typescript-eslint toolchain.
      # Revisit when typescript-eslint announces TS 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "[CI]"
    groups:
      github-actions:
        patterns: ["*"]
