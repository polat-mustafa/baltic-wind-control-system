name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel superseded PR runs; never cancel a run on main/develop (keeps caches warm).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_PYTHON: "3.13"
  FORCE_COLOR: "1"

# ─── Change Detection ──────────────────────────────────────
# docs-only changes skip ALL jobs; backend-only / frontend-only changes skip the other side.

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'

  # ─── Backend ──────────────────────────────────────────────
  # uv + uv.lock: reproducible installs (no version drift) and a cache keyed on the lockfile.
  # torch is resolved from the CPU wheel index on Linux (see backend/pyproject.toml).

  backend-lint:
    name: Backend Lint
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Ruff check
        run: uv run --no-sync ruff check --output-format=github app/ tests/

      - name: Ruff format check
        run: uv run --no-sync ruff format --check app/ tests/

      - name: Restore mypy cache
        uses: actions/cache@v6
        with:
          path: backend/.mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}-${{ github.sha }}
          restore-keys: mypy-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}-

      - name: Mypy
        run: uv run --no-sync mypy app/

  # 3 shards run in parallel, each with one pytest worker per core (4 on ubuntu-latest).
  # pytest-split balances shards using backend/.test_durations; refresh it occasionally with
  #   cd backend && python -m pytest -n 4 --store-durations --durations-path .test_durations
  # (new tests missing from the file are still run — they are assigned the average duration).
  backend-test:
    name: Backend Test (${{ matrix.group }}/3)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      # Validation-only tools outside the app's lock: lxml for the IEC 61850-6 XSD check of
      # the SCL files (tests/test_scl_schema.py; the test skips without it).
      - name: Install validation tools
        run: uv pip install "lxml>=5.3"

      - name: Run tests with coverage
        run: >-
          uv run --no-sync pytest -n auto -q -o addopts="--tb=short"
          --splits 3 --group ${{ matrix.group }} --durations-path .test_durations
          --durations=10
          --cov=app --cov-report=xml --cov-report=term-missing:skip-covered
          tests/

      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-${{ matrix.group }}
          path: backend/coverage.xml

  # ─── Frontend ─────────────────────────────────────────────

  frontend-lint:
    name: Frontend Lint
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/

  frontend-test:
    name: Frontend Test
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # Turkish UI gate: opens every page and tab in Chrome with Turkish on (no backend, so the
  # error and empty states are checked too) and fails on visible English text that is not in
  # scripts/i18n-allowlist.txt (names, citations, ids, units).
  frontend-i18n:
    name: Frontend Turkish
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Start the dev server
        run: |
          nohup npx vite --port 5173 --strictPort > /tmp/vite.log 2>&1 &
          for i in $(seq 90); do curl -sf http://localhost:5173 > /dev/null && exit 0; sleep 1; done
          cat /tmp/vite.log && exit 1

      - name: Every visible text has its Turkish (system Chrome)
        run: node scripts/i18n-missing.mjs tr http://localhost:5173 --check

  # Single required check for branch protection: passes when every needed job passed or was skipped.
  ci-ok:
    name: CI OK
    if: always()
    needs: [backend-lint, backend-test, frontend-lint, frontend-test, frontend-i18n]
    runs-on: ubuntu-latest
    steps:
      - name: Verify job results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more CI jobs failed or were cancelled." && exit 1
          fi
