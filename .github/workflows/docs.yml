name: Site

# GitHub Pages: showcase page (/), static demo (/demo/), MkDocs handbook (/docs/).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "frontend/**"
      - ".github/workflows/docs.yml"
  # Manual redeploy, e.g. after a transient Pages/OIDC failure.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build showcase + demo
        working-directory: frontend
        run: npm ci && node scripts/build-site.mjs

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-docs-${{ hashFiles('requirements-docs.txt') }}
          restore-keys: ${{ runner.os }}-pip-docs-

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      - name: Build handbook
        run: mkdocs build --site-dir frontend/dist-site/docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist-site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
