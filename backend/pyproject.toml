[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "offshoreforge-backend"
version = "0.1.0"
description = "OffshoreForge backend — offshore wind engineering simulation and training platform"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.18.4",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "numpy>=2.0.0",
    "scipy>=1.17.1",
    "py-wake>=2.5.0",
    "xarray>=2024.1.0",
    "pandapower>=2.14.0",
    "andes>=1.10.0",
    "xgboost>=2.0",
    "scikit-learn>=1.5",
    "shap>=0.46",
    "torch>=2.2",
    "structlog>=24.0.0",
    "asyncua>=1.1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pytest-xdist>=3.6.0",
    "pytest-split>=0.10.0",
    "aiosqlite>=0.20.0",  # tests/test_projects.py: in-memory SQLite for the projects API
]

# ─── uv (lockfile + CPU-only torch on Linux/CI) ─────────────────
# uv.lock pins every transitive dependency so CI and local runs are reproducible.
# On Linux, torch comes from the CPU wheel index (~200 MB instead of ~2.5 GB CUDA build).

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ─── Ruff (linting + formatting) ────────────────────────────────

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "RUF001", # ambiguous Unicode in strings (×, –, −, γ used in engineering formulas)
    "RUF002", # ambiguous Unicode in docstrings (×, α, ≈ used in engineering formulas)
    "RUF003", # ambiguous Unicode in comments (same reason)
    "B008",   # Depends() and Query() in FastAPI function signatures (standard pattern)
]

[tool.ruff.lint.per-file-ignores]
# Data-heavy narrative files: long scenario/description strings are intentional
"app/services/p3/security.py" = ["E501"]
"app/schemas/security.py" = ["E501"]
"app/schemas/market.py" = ["E501"]
"app/services/p2/market.py" = ["E501"]
# FastAPI Query() descriptions and formula-heavy tests push past 100 cols
"app/routers/turbine_subsystems.py" = ["E501"]
"app/services/p4/turbine_power_curve.py" = ["E501"]
"tests/test_nacelle_subsystems.py" = ["E501"]
# Physics / engineering variable names (A, B for Walther; S as enum alias; T_K)
"app/services/turbine_physics/nacelle_subsystems.py" = ["N806"]
"app/services/turbine_physics/state_machine.py" = ["N806"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ─── Mypy (strict type checking) ────────────────────────────────

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "scipy.*", "py_wake.*", "xarray.*", "pandapower.*", "andes.*",
    "xgboost.*", "shap.*", "sklearn.*", "torch.*", "asyncua.*",
]
ignore_missing_imports = true

# ─── Pytest ──────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
