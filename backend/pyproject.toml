[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "baltic-wind-backend"
version = "0.1.0"
description = "Backend for the 510 MW Baltic Sea Offshore Wind HV Control Simulation Platform"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "py-wake>=2.5.0",
    "xarray>=2024.1.0",
    "pandapower>=2.14.0",
    "andes>=1.10.0",
    "xgboost>=2.0",
    "scikit-learn>=1.5",
    "shap>=0.46",
    "torch>=2.2",
    "structlog>=24.0.0",
    "asyncua>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

# ─── Ruff (linting + formatting) ────────────────────────────────

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "RUF002", # ambiguous Unicode in docstrings (×, α, ≈ used in engineering formulas)
    "RUF003", # ambiguous Unicode in comments (same reason)
    "B008",   # Depends() and Query() in FastAPI function signatures (standard pattern)
]

[tool.ruff.lint.per-file-ignores]
# Data-heavy narrative files: long scenario/description strings are intentional
"app/services/p3/security.py" = ["E501"]
"app/schemas/security.py" = ["E501"]
"app/schemas/market.py" = ["E501"]
"app/services/p2/market.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ─── Mypy (strict type checking) ────────────────────────────────

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "scipy.*", "py_wake.*", "xarray.*", "pandapower.*", "andes.*",
    "xgboost.*", "shap.*", "sklearn.*", "torch.*", "asyncua.*",
]
ignore_missing_imports = true

# ─── Pytest ──────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
