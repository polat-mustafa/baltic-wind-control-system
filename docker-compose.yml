services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: balticwind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/balticwind
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:3000"]'
    develop:
      watch:
        # Fast feedback for Python/Alembic edits: copy changed files and restart uvicorn.
        - action: sync+restart
          path: ./backend/app
          target: /app/app
          ignore:
            - "**/__pycache__/"
            - "**/*.pyc"
            - ".pytest_cache/"
        - action: sync+restart
          path: ./backend/alembic
          target: /app/alembic
        - action: sync+restart
          path: ./backend/alembic.ini
          target: /app/alembic.ini
        # Dependency, image, or entrypoint changes must rebuild the backend image.
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/Dockerfile
        - action: rebuild
          path: ./backend/entrypoint.sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/health'')"',
        ]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 120s

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    develop:
      watch:
        # This image serves the compiled SPA with nginx, so UI/source edits trigger
        # a frontend-only rebuild. npm ci remains cached until package files change.
        - action: rebuild
          path: ./frontend/src
        - action: rebuild
          path: ./frontend/index.html
        - action: rebuild
          path: ./frontend/vite.config.ts
        - action: rebuild
          path: ./frontend/tsconfig.json
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/.npmrc
        - action: rebuild
          path: ./frontend/nginx.conf
        - action: rebuild
          path: ./frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
