site_name: Baltic Wind HV Control Platform
site_description: 510 MW Baltic Sea offshore wind farm simulation - multilingual documentation
site_url: https://polat-mustafa.github.io/baltic-wind-control-system/
repo_url: https://github.com/polat-mustafa/baltic-wind-control-system
repo_name: baltic-wind-control-system

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

