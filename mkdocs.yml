site_name: Baltic Wind HV Control Platform
site_description: 510 MW Baltic Sea Offshore Wind Farm Simulation — Documentation
repo_url: https://github.com/polat-mustafa/baltic-wind-control-system
repo_name: baltic-wind-control-system

theme:
  name: material
  palette:
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Engineering Standards: SKILL.md
  - Project Roadmap: Project_Roadmap.md
  - Learning Roadmap: Learning_Roadmap.md
  - Lessons:
    - Overview: lessons/index.md
    - "000 — Project Planning & Engineering Methodology": lessons/lesson-000.md
    - "001 — DevOps Foundation": lessons/lesson-001.md
    - "002 — Internationalization (TR)": lessons/lesson-002.md
    - "003 — Ön Tasarım Kararları (TR)": lessons/lesson-003.md
    - "004 — P1: Veritabanı, ERA5 & Weibull (TR)": lessons/lesson-004.md
    - "005 — Rüzgar Gülü & İz Modeli (TR)": lessons/lesson-005.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

plugins:
  - search
