site_name: Baltic Wind HV Control Platform
site_description: 510 MW Baltic Sea Offshore Wind Farm Simulation — Documentation
repo_url: https://github.com/polat/baltic-wind-control-system
repo_name: baltic-wind-control-system

theme:
  name: material
  palette:
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Engineering Standards: SKILL.md
  - Project Roadmap: Project_Roadmap.md
  - Learning Roadmap: Learning_Roadmap.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
