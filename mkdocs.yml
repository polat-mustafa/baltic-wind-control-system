site_name: Baltic Wind HV Control Platform
site_description: 510 MW Baltic Sea offshore wind farm simulation - multilingual documentation
site_url: https://polat-mustafa.github.io/baltic-wind-control-system/
repo_url: https://github.com/polat-mustafa/baltic-wind-control-system
repo_name: baltic-wind-control-system

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Methods & References: references.md
  - Engineering Standards: SKILL.md
  - Project Roadmap: Project_Roadmap.md
  - Learning Roadmap: Learning_Roadmap.md
  - English:
      - Overview: en/index.md
      - User Guide: en/user-guide.md
  - Türkçe:
      - Genel Bakış: tr/index.md
      - Kullanıcı Kılavuzu: KULLANICI_KILAVUZU.md
  - Polski:
      - Przegląd: pl/index.md
      - Przewodnik użytkownika: pl/przewodnik-uzytkownika.md

extra:
  alternate:
    - name: English
      link: /baltic-wind-control-system/en/
      lang: en
    - name: Türkçe
      link: /baltic-wind-control-system/tr/
      lang: tr
    - name: Polski
      link: /baltic-wind-control-system/pl/
      lang: pl

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

plugins:
  - search
